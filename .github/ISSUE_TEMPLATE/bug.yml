name: bug report
description: report a reproducible incorrect decision or runtime failure
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove company-confidential positioning and drafts before submitting.
  - type: input
    id: version
    attributes:
      label: package version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: surface
      options:
        - CLI
        - MCP
        - TypeScript library
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: smallest fictional reproduction
      description: Include pack, context, draft, and command or tool call.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: expected decision
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: actual decision
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: privacy check
      options:
        - label: I removed private company positioning, proof, and draft content.
          required: true
