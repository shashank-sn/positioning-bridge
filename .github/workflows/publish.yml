name: publish

on:
  release:
    types:
      - published

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Match the release tag to package.json
        run: >-
          node --input-type=module -e "import manifest from './package.json' with {
          type: 'json' }; if (process.env.GITHUB_REF_NAME !== 'v' + manifest.version)
          process.exit(1)"
      - name: Require the release commit on green main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')" = "success"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run smoke:package
      - run: npm publish --access public
